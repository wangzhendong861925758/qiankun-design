<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>乾坤设计 - AI漫剧协作平台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ 登录页 ============ -->
<div class="page" id="page-login">
  <div class="login-box">
    <div class="login-logo">☯</div>
    <h1>乾坤设计</h1>
    <p class="login-sub">AI 漫剧协作平台</p>
    <div class="form-row">
      <label>服务器地址</label>
      <input id="loginServer" placeholder="例如 http://192.168.1.100:3210">
    </div>
    <div class="login-tabs">
      <button class="login-tab active" data-mode="user">校验码登录</button>
      <button class="login-tab" data-mode="admin">管理员登录</button>
    </div>
    <div id="loginUserBox">
      <div class="form-row">
        <label>校验码</label>
        <input id="loginCode" placeholder="请输入管理员分配的校验码" autocomplete="off">
      </div>
    </div>
    <div id="loginAdminBox" class="hidden">
      <div class="form-row"><label>管理员账号</label><input id="loginAdminUser" placeholder="账号" autocomplete="off"></div>
      <div class="form-row"><label>密码</label><input id="loginAdminPass" type="password" placeholder="密码"></div>
    </div>
    <button class="btn primary block" id="btnLogin">登 录</button>
    <p class="login-hint" id="loginHint"></p>
    <p class="login-tip">💡 本机服务已自动启动，管理员用默认地址即可登录；<br>普通成员请填写服务器地址 + 校验码</p>
    <p class="login-ver" id="verBadge"></p>
  </div>
</div>

<!-- ============ 项目列表页 ============ -->
<div class="page hidden" id="page-projects">
  <header class="topbar">
    <div class="topbar-left"><div class="logo">☯ <span>乾坤设计</span></div></div>
    <div class="topbar-right">
      <span class="presence-badge" id="projUserBadge"></span>
      <span class="ver-badge" id="projVerBadge"></span>
      <button class="btn ghost" id="btnLogout1">退出登录</button>
    </div>
  </header>
  <div class="page-body">
    <div class="page-head"><h2>选择项目</h2><p class="page-desc">项目由管理员创建，所有成员共享项目下的人物、场景、道具、音频资产，并可实时共创。</p></div>
    <div class="proj-grid" id="projGrid"></div>
  </div>
</div>

<!-- ============ 分集列表页 ============ -->
<div class="page hidden" id="page-episodes">
  <header class="topbar">
    <div class="topbar-left"><button class="btn ghost small" id="btnBackProj">← 项目</button><div class="logo small">🜂 <span id="epProjName"></span></div></div>
    <div class="topbar-right"><button class="btn primary" id="btnNewEpisode">＋ 新建分集</button></div>
  </header>
  <div class="page-body">
    <div class="page-head"><h2>分集列表</h2><p class="page-desc">每集独立剧本与分镜；资产全项目共享。点击进入编辑，多人可同时编辑同一集。</p></div>
    <div class="ep-list" id="epList"></div>
  </div>
</div>

<!-- ============ 编辑器页 ============ -->
<div class="page hidden" id="page-editor">
  <header class="topbar">
    <div class="topbar-left">
      <button class="btn ghost small" id="btnBackEps">← 分集</button>
      <div class="logo small">🎬 <span id="edEpisodeName"></span></div>
      <span class="save-badge" id="saveBadge">已实时保存</span>
      <span class="presence-badge" id="presenceBadge"></span>
    </div>
    <div class="topbar-right">
      <select class="model-sel" id="selTextModel" title="文本模型"></select>
      <select class="model-sel" id="selImageModel" title="图片模型"></select>
      <select class="model-sel" id="selVideoModel" title="视频模型"></select>
      <span class="ver-badge">480P</span>
      <button class="btn primary" id="btnCompose">🎬 生成视频</button>
    </div>
  </header>
  <div class="editor-grid">
    <!-- 第1列：剧本 -->
    <section class="col col-script">
      <div class="col-head">
        <h3>📝 剧本</h3>
        <div>
          <button class="btn ghost small" id="btnParseScript" title="AI拆解剧本为分镜">✨ AI拆解</button>
        </div>
      </div>
      <div class="col-body">
        <textarea id="scriptInput" placeholder="在此输入或粘贴剧本文本……&#10;&#10;点击「AI拆解」自动分析为分镜（含人物/场景/道具识别、台词提取）。"></textarea>
        <div class="script-meta">
          <label>画幅</label>
          <select id="aspectSel"><option value="9:16">9:16 竖屏</option><option value="16:9">16:9 横屏</option></select>
        </div>
      </div>
    </section>
    <!-- 第2列：分镜 -->
    <section class="col col-story">
      <div class="col-head"><h3 id="storyColTitle">🎞 分镜</h3><button class="btn ghost small" id="btnAddShot">＋ 添加分镜</button></div>
      <div class="col-body" id="shotsWrap"></div>
    </section>
    <!-- 第3列：资产（人物/场景/道具/其他/音效） -->
    <section class="col col-assets">
      <div class="col-head">
        <h3>📦 资产库 <span class="col-sub" id="assetProjTag"></span></h3>
        <button class="btn ghost small" id="btnAddAsset">＋ 新增资产</button>
      </div>
      <div class="asset-tabs" id="assetTabs">
        <button class="asset-tab active" data-tab="characters">👥 人物</button>
        <button class="asset-tab" data-tab="scenes">🏞 场景</button>
        <button class="asset-tab" data-tab="props">🗡 道具</button>
        <button class="asset-tab" data-tab="others">✨ 其他</button>
        <button class="asset-tab" data-tab="sfx">🔊 音效</button>
      </div>
      <div class="col-body" id="assetsWrap"></div>
    </section>
  </div>
</div>

<!-- ============ 管理端页 ============ -->
<div class="page hidden" id="page-admin">
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">🛡 <span>乾坤设计 · 管理端</span></div>
      <span class="admin-name" id="adminName"></span>
    </div>
    <div class="topbar-right"><span class="ver-badge" id="adminVerBadge"></span><button class="btn ghost" id="btnLogout2">退出</button></div>
  </header>
  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="stats">📊 数据统计</button>
    <button class="admin-tab" data-tab="users">👤 管理用户</button>
    <button class="admin-tab" data-tab="projects">📁 项目管理</button>
    <button class="admin-tab" data-tab="server">🖥 服务管理</button>
  </div>
  <div class="page-body" id="adminBody"></div>
</div>

<!-- 更新提示条（全局，任何页面都可见） -->
<div class="update-bar hidden" id="updateBar">
  <span id="updateBarText"></span>
  <div class="update-bar-actions">
    <button class="btn primary small" id="btnInstallUpdate">保存并重启安装</button>
    <button class="btn ghost small" id="btnDismissUpdate">稍后</button>
  </div>
</div>

<!-- 更新悬浮按钮 -->
<button class="update-fab" id="btnCheckUpdate" title="检查更新">🔄</button>

<!-- ============ 通用弹窗 ============ -->
<div class="modal-mask hidden" id="modalMask">
  <div class="modal" id="modalBox">
    <div class="modal-head"><h3 id="modalTitle">弹窗</h3><button class="close" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast-wrap" id="toastWrap"></div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
